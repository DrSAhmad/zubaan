<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zubaan — Learn 12 Languages | زبان</title>
<meta name="description" content="Zubaan: learn English, Urdu, Chinese, French, German, Japanese, Persian, Arabic, Hindi, Portuguese, Italian & Russian. Audio, reading, writing and speaking practice — free.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a5f46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zubaan">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--teal:#0e7c5b;--teal-d:#0a5f46;--amber:#f5a623;--bg:#f6f4ee;--ink:#1f2937;--muted:#6b7280;--card:#fff;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Nastaliq Urdu",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:1020px;margin:0 auto}
.logo{font-size:22px;font-weight:800;color:var(--teal-d);cursor:pointer}
.logo span{color:var(--amber)}
.stats{display:flex;gap:14px;font-size:14px;font-weight:700}
.stats b{color:var(--amber)}
.hero{background:linear-gradient(135deg,#0e7c5b,#0a5f46);color:#fff;padding:44px 16px;text-align:center}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:800}
.hero h1 .ur{font-weight:400}
.hero p{opacity:.92;max-width:600px;margin:10px auto 0}
section{padding:36px 0}
.sec-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sec-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.lcard{background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.06);transition:transform .12s}
.lcard:hover{transform:translateY(-3px)}
.lcard .fl{font-size:38px}
.lcard h3{font-size:15px;margin:6px 0 2px}
.lcard .nat{font-size:13px;color:var(--muted)}
.xpbar{height:6px;background:#e5e7eb;border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f97316);border-radius:99px}
.lvl{font-size:11px;color:var(--muted);margin-top:4px}
/* language page */
.back{display:inline-block;margin:18px 0 6px;color:var(--teal);font-weight:700;cursor:pointer;font-size:14px}
.lhead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.lhead .fl{font-size:52px}
.lhead h2{font-size:24px}
.lhead .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 16px;border-radius:999px;background:#e9e4d8;font-weight:700;font-size:14px;cursor:pointer;border:none}
.tab.on{background:var(--teal);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.pcard .t{font-size:22px;font-weight:800}
.pcard .r{color:var(--teal);font-size:14px;margin:2px 0 8px}
.pcard .m{font-size:14px}
.pcard .m .ur{color:var(--muted)}
.spk{margin-top:10px;display:inline-block;background:#eef7f2;color:var(--teal-d);border:none;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.scriptbox{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.scriptbox h3{margin-bottom:8px}
.scriptbox p{color:var(--muted);font-size:14px;margin-bottom:12px}
.scriptbox .sample{font-size:24px;line-height:2;background:#f6f4ee;border-radius:10px;padding:16px;word-spacing:6px}
/* flashcards */
.fcard{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.1);padding:44px 24px;text-align:center;max-width:520px;margin:0 auto;cursor:pointer;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fcard .big{font-size:38px;font-weight:800}
.fcard .rom{color:var(--teal);font-size:17px}
.fcard .mean{font-size:17px}
.fcard .hint{font-size:12px;color:var(--muted)}
.fnav{display:flex;justify-content:center;gap:12px;margin-top:18px;align-items:center}
.btn{padding:11px 22px;border-radius:999px;font-weight:700;font-size:15px;border:none;cursor:pointer}
.btn-p{background:var(--teal);color:#fff}
.btn-g{background:#e5e7eb;color:var(--ink)}
.btn-a{background:var(--amber);color:#fff}
/* practice modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mode{background:var(--card);border-radius:var(--radius);padding:24px 18px;text-align:center;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.mode .ic{font-size:40px}
.mode h3{margin:8px 0 4px;font-size:16px}
.mode p{font-size:13px;color:var(--muted)}
/* quiz/session */
.sess{max-width:560px;margin:0 auto}
.qbox{background:var(--card);border-radius:18px;padding:30px 22px;box-shadow:0 6px 24px rgba(0,0,0,.1);text-align:center}
.qbox .prompt{font-size:30px;font-weight:800;margin:8px 0}
.qbox .prow{color:var(--teal);font-size:15px;margin-bottom:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{background:#f6f4ee;border:2px solid transparent;border-radius:12px;padding:13px;font-size:16px;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--teal)}
.opt.right{background:#d1fae5;border-color:var(--teal)}
.opt.wrong{background:#fee2e2;border-color:#ef4444}
.prog{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--teal)}
.score{font-size:15px;color:var(--muted);margin-bottom:10px}
.bigscore{font-size:52px;font-weight:800;color:var(--teal-d)}
.winput{width:100%;padding:14px;font-size:18px;border:2px solid #d1d5db;border-radius:12px;margin:14px 0;text-align:center}
.micbtn{width:96px;height:96px;border-radius:50%;background:var(--teal);color:#fff;font-size:40px;border:none;cursor:pointer;margin:10px auto;display:block}
.micbtn.live{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.verdict{font-size:18px;font-weight:800;margin-top:12px}
footer{background:#10231c;color:#cbd5e1;padding:28px 16px;text-align:center;font-size:13px;margin-top:30px}
.note{background:#fff8e6;border:1px solid #f5d97a;border-radius:10px;padding:12px 16px;font-size:13px;color:#7a5c00;margin:14px 0}
</style>
</head>
<body>
<header class="top"><div class="hd">
  <div class="logo" onclick="go('home')">Zubaan <span>زبان</span></div>
  <div class="stats"><span>🔥 <b id="st-streak">0</b></span><span>⭐ <b id="st-xp">0</b> XP</span></div>
</div></header>
<div id="view"></div>
<footer>Zubaan — learn 12 languages free. Progress saves on this device. 🔊 audio uses your device's voices.</footer>
<script src="data.js"></script>
<script>
/* ============ state ============ */
const S = {
  xp: JSON.parse(localStorage.getItem("zubaan_xp")||"{}"),
  streak: JSON.parse(localStorage.getItem("zubaan_streak")||'{"d":"","n":0}')
};
function save(){localStorage.setItem("zubaan_xp",JSON.stringify(S.xp));localStorage.setItem("zubaan_streak",JSON.stringify(S.streak));}
function addXP(lang,n){
  S.xp[lang]=(S.xp[lang]||0)+n;
  const today=new Date().toISOString().slice(0,10);
  if(S.streak.d!==today){S.streak.d=today;S.streak.n=(S.streak.n||0)+1;}
  save(); paintStats();
}
function level(xp){return Math.floor((xp||0)/100)+1;}
function paintStats(){
  document.getElementById("st-xp").textContent=Object.values(S.xp).reduce((a,b)=>a+b,0);
  document.getElementById("st-streak").textContent=S.streak.n||0;
}
const lang = id => LANGS.find(l=>l.id===id);
/* ============ audio ============ */
function speak(text, code){
  try{
    const u=new SpeechSynthesisUtterance(text); u.lang=code; u.rate=0.85;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(code.slice(0,2).toLowerCase()));
    if(v)u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
if(window.speechSynthesis) speechSynthesis.getVoices();
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLowerCase().replace(/[؟?.,!¡،؛:"'’\-()]/g,"").trim();}
function go(v,a){ if(v==="home")renderHome(); else if(v==="lang")renderLang(a); window.scrollTo(0,0); }
function speakBtn(t,code){return `<button class="spk" onclick="event.stopPropagation();speak('${esc(t).replace(/'/g,"\\'")}','${code}')">🔊 Listen</button>`;}
/* ============ views ============ */
function renderHome(){
  const cards=LANGS.map(l=>{
    const xp=S.xp[l.id]||0, pct=Math.min(100,(xp%100));
    return `<div class="lcard" onclick="go('lang','${l.id}')">
      <div class="fl">${l.flag}</div><h3>${l.name}</h3><div class="nat">${esc(l.native)}</div>
      <div class="xpbar"><i style="width:${pct}%"></i></div><div class="lvl">Level ${level(xp)} · ${xp} XP</div></div>`;
  }).join("");
  $("view").innerHTML=`
  <div class="hero"><h1>Learn 12 Languages <span class="ur">— زبان</span></h1>
  <p>English · اردو · 中文 · Français · Deutsch · 日本語 · فارسی · العربية · हिन्दी · Português · Italiano · Русский.<br>Audio, reading, writing & speaking practice — free, on your phone.</p></div>
  <section><div class="wrap"><h2 class="sec-title">Pick your language</h2>
  <p class="sec-sub">Every item shows native script + pronunciation + English + اردو</p>
  <div class="lgrid">${cards}</div></div></section>`;
  paintStats();
}
function renderLang(id){
  const l=lang(id);
  $("view").innerHTML=`
  <div class="wrap"><span class="back" onclick="go('home')">← All languages</span>
  <div class="lhead"><div class="fl">${l.flag}</div>
    <div><h2>${l.name} <span style="font-weight:400;color:var(--muted)">${esc(l.native)}</span></h2>
    <div class="sub">Level ${level(S.xp[id]||0)} · ${S.xp[id]||0} XP</div></div></div>
  <div class="tabs">
    <button class="tab on" data-t="script" onclick="tab('${id}','script',this)">🔤 Script</button>
    <button class="tab" data-t="phrases" onclick="tab('${id}','phrases',this)">💬 Phrases</button>
    <button class="tab" data-t="words" onclick="tab('${id}','words',this)">📚 Words</button>
    <button class="tab" data-t="practice" onclick="tab('${id}','practice',this)">🎯 Practice</button>
    <button class="tab" data-t="quiz" onclick="tab('${id}','quiz',this)">📝 Quiz</button>
  </div><div id="tabbody"></div></div>`;
  tab(id,"script",document.querySelector(".tab")); paintStats();
}
function tab(id,t,el){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  if(el)el.classList.add("on");
  const l=lang(id), B=$("tabbody");
  if(t==="script")B.innerHTML=`<div class="scriptbox"><h3>${esc(l.script.title)}</h3><p>${esc(l.script.desc)}</p><div class="sample" dir="${l.dir}">${esc(l.script.sample)}</div></div>`;
  if(t==="phrases")B.innerHTML=`<div class="cards">`+l.phrases.map(p=>pcard(p,l)).join("")+`</div>`;
  if(t==="words")B.innerHTML=`<div class="cards">`+[...l.numbers.map(n=>({...n,tag:"🔢"})),...l.vocab.map(v=>({...v,tag:"📖"}))].map(p=>pcard(p,l)).join("")+`</div>`;
  if(t==="practice")B.innerHTML=practiceMenu(id);
  if(t==="quiz")startQuiz(id);
}
function pcard(p,l){
  return `<div class="pcard"><div class="t" dir="auto">${esc(p.t)}</div>
  <div class="r">${esc(p.r)}</div><div class="m">${esc(p.en)}<br><span class="ur">${esc(p.ur)}</span></div>
  ${speakBtn(p.t,l.tts)}</div>`;
}
/* ============ flashcards (reading) ============ */
let FC={items:[],i:0,flipped:false,lang:null};
function flashStart(id,items,mode){
  const l=lang(id); FC={items:shuffle(items).slice(0,10),i:0,flipped:false,lang:l,mode:mode||"full"};
  flashShow();
}
function flashShow(){
  const l=FC.lang,it=FC.items[FC.i],B=$("tabbody");
  const front=FC.mode==="reading"
    ? `<div class="big" dir="auto">${esc(it.t)}</div><div class="hint">Read it aloud, then tap to check</div>`
    : `<div class="big" dir="auto">${esc(it.t)}</div><div class="rom">${esc(it.r)}</div><div class="hint">Tap to see meaning</div>`;
  const back=`<div class="big" dir="auto">${esc(it.t)}</div><div class="rom">${esc(it.r)}</div>
    <div class="mean">${esc(it.en)}</div><div class="mean" style="color:var(--muted)">${esc(it.ur)}</div>`;
  B.innerHTML=`<div class="sess"><div class="score">${FC.i+1} / ${FC.items.length} · 📖 Reading practice</div>
  <div class="fcard" onclick="flashFlip()">${FC.flipped?back:front}</div>
  <div style="text-align:center;margin-top:10px">${speakBtn(it.t,l.tts)}</div>
  <div class="fnav"><button class="btn btn-g" onclick="flashNav(-1)">← Prev</button>
  <button class="btn btn-p" onclick="flashNav(1)">${FC.i===FC.items.length-1?"Finish ✓":"Next →"}</button></div></div>`;
}
function flashFlip(){ if(!FC.flipped){FC.flipped=true; addXP(FC.lang.id,2);} flashShow(); }
function flashNav(d){
  FC.i+=d; FC.flipped=false;
  if(FC.i>=FC.items.length){tab(FC.lang.id,"practice",null);return;}
  if(FC.i<0)FC.i=0; flashShow();
}
/* ============ practice menu ============ */
function practiceMenu(id){
  return `<div class="modes">
  <div class="mode" onclick="listenStart('${id}')"><div class="ic">🔊</div><h3>Listening</h3><p>Hear it, pick the meaning</p></div>
  <div class="mode" onclick="flashStart('${id}',lang('${id}').phrases,'reading')"><div class="ic">📖</div><h3>Reading</h3><p>Read the script, flip to check</p></div>
  <div class="mode" onclick="writeStart('${id}')"><div class="ic">✍️</div><h3>Writing</h3><p>Type the word from memory</p></div>
  <div class="mode" onclick="speakStart('${id}')"><div class="ic">🎙️</div><h3>Speaking</h3><p>Say it aloud, get scored</p></div></div>
  ${SR?"":`<div class="note">🎙️ Your browser doesn't support mic scoring — speaking mode will use self-check instead. Chrome on Android works best.</div>`}`;
}
/* ============ listening ============ */
let LS={};
function listenStart(id){
  const l=lang(id),pool=shuffle([...l.phrases,...l.vocab]).slice(0,10);
  LS={l,pool,i:0,score:0};
  setTimeout(()=>speak(pool[0].t,l.tts),400); listenShow();
}
function listenShow(){
  const l=LS.l,it=LS.pool[LS.i],B=$("tabbody");
  const opts=shuffle([it,...shuffle(l.vocab.filter(v=>v.en!==it.en)).slice(0,3)]);
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${LS.i*10}%"></i></div>
  <div class="score">${LS.i+1}/10 · 🔊 Listening — score ${LS.score}</div>
  <div class="qbox"><div class="prow">Listen carefully…</div>
  <button class="btn btn-a" onclick="speak('${esc(it.t).replace(/'/g,"\\'")}','${l.tts}')">🔊 Play again</button>
  <div class="opts">${opts.map(o=>`<div class="opt" onclick="listenAns(this,'${esc(o.en).replace(/'/g,"\\'")}','${esc(it.en).replace(/'/g,"\\'")}')">${esc(o.en)}<br><small style="color:var(--muted)">${esc(o.ur)}</small></div>`).join("")}</div></div></div>`;
}
function listenAns(el,pick,correct){
  document.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents="none");
  if(pick===correct){el.classList.add("right");LS.score++;addXP(LS.l.id,10);}
  else{el.classList.add("wrong");[...document.querySelectorAll(".opt")].find(o=>o.textContent.includes(correct)).classList.add("right");}
  setTimeout(()=>{LS.i++; if(LS.i>=10)doneScreen(LS.l,"🔊 Listening",LS.score,10); else{listenShow();setTimeout(()=>speak(LS.pool[LS.i].t,LS.l.tts),400);}},1100);
}
/* ============ writing ============ */
let WR={};
function writeStart(id){
  const l=lang(id); WR={l,pool:shuffle([...l.phrases,...l.vocab]).slice(0,10),i:0,score:0}; writeShow();
}
function writeShow(){
  const it=WR.pool[WR.i],B=$("tabbody");
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${WR.i*10}%"></i></div>
  <div class="score">${WR.i+1}/10 · ✍️ Writing — score ${WR.score}</div>
  <div class="qbox"><div class="prow">Type this in <b>${WR.l.name}</b> (native script or roman letters)</div>
  <div class="prompt" style="font-size:22px">${esc(it.en)}</div><div style="color:var(--muted)">${esc(it.ur)}</div>
  <input class="winput" id="wans" dir="auto" placeholder="type here…" autocomplete="off">
  <button class="btn btn-p" onclick="writeAns()">Check ✓</button>
  <div id="wfb"></div></div></div>`;
  $("wans").addEventListener("keydown",e=>{if(e.key==="Enter")writeAns();});
  setTimeout(()=>$("wans").focus(),300);
}
function writeAns(){
  const it=WR.pool[WR.i],v=norm($("wans").value),ok=v&& (v===norm(it.t)||v===norm(it.r));
  const fb=$("wfb");
  if(ok){WR.score++;addXP(WR.l.id,10);fb.innerHTML=`<div class="verdict" style="color:var(--teal)">✓ Correct! ${esc(it.t)} (${esc(it.r)})</div>`;}
  else fb.innerHTML=`<div class="verdict" style="color:#b45309">Answer: <span dir="auto">${esc(it.t)}</span> <small>(${esc(it.r)})</small></div>
  <button class="btn btn-g" style="margin-top:10px" onclick="speak('${esc(it.t).replace(/'/g,"\\'")}','${WR.l.tts}')">🔊 Hear it</button>`;
  setTimeout(()=>{WR.i++; if(WR.i>=10)doneScreen(WR.l,"✍️ Writing",WR.score,10); else writeShow();},1600);
}
/* ============ speaking ============ */
let SP={};
function speakStart(id){
  const l=lang(id); SP={l,pool:shuffle(l.phrases).slice(0,10),i:0,score:0}; speakShow();
}
function speakShow(){
  const it=SP.pool[SP.i],B=$("tabbody");
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${SP.i*10}%"></i></div>
  <div class="score">${SP.i+1}/10 · 🎙️ Speaking — score ${SP.score}</div>
  <div class="qbox"><div class="prow">Say this aloud:</div>
  <div class="prompt" dir="auto">${esc(it.t)}</div><div class="prow">${esc(it.r)} · ${esc(it.en)}</div>
  <button class="btn btn-a" onclick="speak('${esc(it.t).replace(/'/g,"\\'")}','${SP.l.tts}')">🔊 Hear model</button>
  <div style="margin:14px 0">${SR?`<button class="micbtn" id="micb" onclick="micGo()">🎙️</button><div class="hint" style="font-size:13px;color:var(--muted)">Tap mic & speak</div>`
  :`<button class="btn btn-p" onclick="speakSelf(true)">✓ I said it well</button>
    <button class="btn btn-g" onclick="speakSelf(false)">↻ Let me retry</button>`}</div>
  <div id="sfb"></div></div></div>`;
}
function micGo(){
  const it=SP.pool[SP.i],b=$("micb"); b.classList.add("live");
  const rec=new SR(); rec.lang=SP.l.tts; rec.interimResults=false;
  rec.onresult=e=>{
    b.classList.remove("live");
    const said=e.results[0][0].transcript, fb=$("sfb");
    const a=norm(said),t=norm(it.t),r=norm(it.r);
    const good=a===t||a===r||a.includes(t)||t.includes(a)||a.includes(r)||r.includes(a);
    fb.innerHTML=`<div style="font-size:14px;color:var(--muted)">Heard: "${esc(said)}"</div>`+
      (good?`<div class="verdict" style="color:var(--teal)">Excellent! ⭐</div>`:`<div class="verdict" style="color:#b45309">Good try — listen & repeat 🔁</div>
      <button class="btn btn-g" style="margin-top:8px" onclick="speak('${esc(it.t).replace(/'/g,"\\'")}','${SP.l.tts}')">🔊 Hear model</button>`);
    if(good){SP.score++;addXP(SP.l.id,10);}
    setTimeout(()=>{SP.i++; if(SP.i>=10)doneScreen(SP.l,"🎙️ Speaking",SP.score,10); else speakShow();},1800);
  };
  rec.onerror=()=>{b.classList.remove("live");$("sfb").innerHTML=`<div class="note">Mic didn't catch that — try again, or use the self-check buttons.</div>
  <button class="btn btn-p" onclick="speakSelf(true)">✓ I said it well</button>`;};
  rec.start();
}
function speakSelf(good){ if(good){SP.score++;addXP(SP.l.id,10);} SP.i++; if(SP.i>=10)doneScreen(SP.l,"🎙️ Speaking",SP.score,10); else speakShow(); }
/* ============ quiz ============ */
let QZ={};
function startQuiz(id){
  const l=lang(id),pool=[...l.phrases,...l.numbers,...l.vocab];
  QZ={l,i:0,score:0,qs:shuffle(pool).slice(0,10)}; quizShow();
}
function quizShow(){
  const l=QZ.l,it=QZ.qs[QZ.i],B=$("tabbody"),flip=Math.random()<0.5;
  const q=flip?{p:it.t,sub:it.r,opts:"en",ans:it.en}:{p:it.en,sub:it.ur,opts:"t",ans:it.t};
  const pool=[...l.phrases,...l.numbers,...l.vocab].filter(x=>x.en!==it.en);
  const opts=shuffle([it,...shuffle(pool).slice(0,3)]);
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${QZ.i*10}%"></i></div>
  <div class="score">${QZ.i+1}/10 · 📝 Quiz — score ${QZ.score}</div>
  <div class="qbox"><div class="prow">${flip?"What does this mean?":"How do you say this in "+l.name+"?"}</div>
  <div class="prompt" dir="auto">${esc(q.p)}</div>${q.sub?`<div class="prow">${esc(q.sub)}</div>`:""}
  ${flip?speakBtn(it.t,l.tts):""}
  <div class="opts">${opts.map(o=>{const v=q.opts==="en"?o.en:o.t;return `<div class="opt" dir="auto" onclick="quizAns(this,'${esc(v).replace(/'/g,"\\'")}','${esc(q.ans).replace(/'/g,"\\'")}')">${esc(v)}</div>`;}).join("")}</div></div></div>`;
}
function quizAns(el,pick,correct){
  document.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents="none");
  if(pick===correct){el.classList.add("right");QZ.score++;addXP(QZ.l.id,10);}
  else{el.classList.add("wrong");[...document.querySelectorAll(".opt")].find(o=>o.textContent===correct).classList.add("right");}
  setTimeout(()=>{QZ.i++; if(QZ.i>=10)doneScreen(QZ.l,"📝 Quiz",QZ.score,10); else quizShow();},1000);
}
function doneScreen(l,title,score,total){
  const B=$("tabbody"),msg=score>=8?"Outstanding! 🏆":score>=5?"Good progress! 💪":"Keep practising! 🌱";
  B.innerHTML=`<div class="sess"><div class="qbox"><div class="prow">${title} complete</div>
  <div class="bigscore">${score}/${total}</div><p>${msg} +${score*10} XP earned</p>
  <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
  <button class="btn btn-p" onclick="tab('${l.id}','practice',null)">🎯 More practice</button>
  <button class="btn btn-g" onclick="go('home')">🌍 Languages</button></div></div></div>`;
  paintStats();
}
renderHome();
/* PWA: register service worker for offline + installable app */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
