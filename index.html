<style>
:root{--teal:#0e7c5b;--teal-d:#0a5f46;--amber:#f5a623;--bg:#f6f4ee;--ink:#1f2937;--muted:#6b7280;--card:#fff;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Nastaliq Urdu",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:1020px;margin:0 auto}
.logo{font-size:22px;font-weight:800;color:var(--teal-d);cursor:pointer}
.logo span{color:var(--amber)}
.stats{display:flex;gap:14px;font-size:14px;font-weight:700}
.stats b{color:var(--amber)}
.hero{background:linear-gradient(135deg,#0e7c5b,#0a5f46);color:#fff;padding:44px 16px;text-align:center}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:800}
.hero h1 .ur{font-weight:400}
.hero p{opacity:.92;max-width:600px;margin:10px auto 0}
section{padding:36px 0}
.sec-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.sec-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.lcard{background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.06);transition:transform .12s}
.lcard:hover{transform:translateY(-3px)}
.lcard .fl{font-size:38px}
.lcard h3{font-size:15px;margin:6px 0 2px}
.lcard .nat{font-size:13px;color:var(--muted)}
.xpbar{height:6px;background:#e5e7eb;border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f97316);border-radius:99px}
.lvl{font-size:11px;color:var(--muted);margin-top:4px}
/* language page */
.back{display:inline-block;margin:18px 0 6px;color:var(--teal);font-weight:700;cursor:pointer;font-size:14px}
.lhead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.lhead .fl{font-size:52px}
.lhead h2{font-size:24px}
.lhead .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 16px;border-radius:999px;background:#e9e4d8;font-weight:700;font-size:14px;cursor:pointer;border:none}
.tab.on{background:var(--teal);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.pcard .t{font-size:22px;font-weight:800}
.pcard .r{color:var(--teal);font-size:14px;margin:2px 0 8px}
.pcard .m{font-size:14px}
.pcard .m .ur{color:var(--muted)}
.spk{margin-top:10px;display:inline-block;background:#eef7f2;color:var(--teal-d);border:none;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.scriptbox{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.scriptbox h3{margin-bottom:8px}
.scriptbox p{color:var(--muted);font-size:14px;margin-bottom:12px}
.scriptbox .sample{font-size:24px;line-height:2;background:#f6f4ee;border-radius:10px;padding:16px;word-spacing:6px}
/* flashcards */
.fcard{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.1);padding:44px 24px;text-align:center;max-width:520px;margin:0 auto;cursor:pointer;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fcard .big{font-size:38px;font-weight:800}
.fcard .rom{color:var(--teal);font-size:17px}
.fcard .mean{font-size:17px}
.fcard .hint{font-size:12px;color:var(--muted)}
.fnav{display:flex;justify-content:center;gap:12px;margin-top:18px;align-items:center}
.btn{padding:11px 22px;border-radius:999px;font-weight:700;font-size:15px;border:none;cursor:pointer}
.btn-p{background:var(--teal);color:#fff}
.btn-g{background:#e5e7eb;color:var(--ink)}
.btn-a{background:var(--amber);color:#fff}
/* practice modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mode{background:var(--card);border-radius:var(--radius);padding:24px 18px;text-align:center;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.mode .ic{font-size:40px}
.mode h3{margin:8px 0 4px;font-size:16px}
.mode p{font-size:13px;color:var(--muted)}
/* quiz/session */
.sess{max-width:560px;margin:0 auto}
.qbox{background:var(--card);border-radius:18px;padding:30px 22px;box-shadow:0 6px 24px rgba(0,0,0,.1);text-align:center}
.qbox .prompt{font-size:30px;font-weight:800;margin:8px 0}
.qbox .prow{color:var(--teal);font-size:15px;margin-bottom:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{background:#f6f4ee;border:2px solid transparent;border-radius:12px;padding:13px;font-size:16px;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--teal)}
.opt.right{background:#d1fae5;border-color:var(--teal)}
.opt.wrong{background:#fee2e2;border-color:#ef4444}
.prog{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--teal)}
.score{font-size:15px;color:var(--muted);margin-bottom:10px}
.bigscore{font-size:52px;font-weight:800;color:var(--teal-d)}
.winput{width:100%;padding:14px;font-size:18px;border:2px solid #d1d5db;border-radius:12px;margin:14px 0;text-align:center}
.micbtn{width:96px;height:96px;border-radius:50%;background:var(--teal);color:#fff;font-size:40px;border:none;cursor:pointer;margin:10px auto;display:block}
.micbtn.live{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media print{header.top,.tabs,.btn,.back,footer,.noprint,.fnav,.spk{display:none!important}body{background:#fff}.wrap{max-width:100%}.pcard{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
/* checkout */
.co-m{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid #eee;border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
.co-m.on{border-color:var(--teal);background:#f0fdf4}
.co-m input{transform:scale(1.3);accent-color:var(--teal)}
.co-ic{font-size:30px}
.co-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px 4px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.co-bar .btn{box-shadow:0 4px 14px rgba(249,115,22,.4)}
.verdict{font-size:18px;font-weight:800;margin-top:12px}
footer{background:#10231c;color:#cbd5e1;padding:28px 16px;text-align:center;font-size:13px;margin-top:30px}
.note{background:#fff8e6;border:1px solid #f5d97a;border-radius:10px;padding:12px 16px;font-size:13px;color:#7a5c00;margin:14px 0}
</style>
</head>
<body>
<header class="top"><div class="hd">
  <div class="logo" onclick="go('home')">Zubaan <span>زبان</span></div>
  <div class="stats"><span id="st-tier" style="color:var(--teal-d)">🆓</span><span>🔥 <b id="st-streak">0</b></span><span>⭐ <b id="st-xp">0</b> XP</span></div>
</div></header>
<div id="view"></div>
<footer>Zubaan — learn 12 languages free. Progress saves on this device. 🔊 audio uses your device's voices.</footer>
<script src="data.js"></script>
<script>
/* ============ state ============ */
const S = {
  xp: JSON.parse(localStorage.getItem("zubaan_xp")||"{}"),
  streak: JSON.parse(localStorage.getItem("zubaan_streak")||'{"d":"","n":0}')
};
function save(){localStorage.setItem("zubaan_xp",JSON.stringify(S.xp));localStorage.setItem("zubaan_streak",JSON.stringify(S.streak));}
function addXP(lang,n){
  S.xp[lang]=(S.xp[lang]||0)+n;
  const today=new Date().toISOString().slice(0,10);
  if(S.streak.d!==today){S.streak.d=today;S.streak.n=(S.streak.n||0)+1;}
  save(); paintStats();
}
function level(xp){return Math.floor((xp||0)/100)+1;}
function paintStats(){
  document.getElementById("st-xp").textContent=Object.values(S.xp).reduce((a,b)=>a+b,0);
  document.getElementById("st-streak").textContent=S.streak.n||0;
  const t=document.getElementById("st-tier");if(t){const n=unlockedCount();t.textContent=n?`🔓${n}/12`:"🆓";}
}
const lang = id => LANGS.find(l=>l.id===id);
/* ============ audio ============ */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){VOICES=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
let _awT=null;
function audioWarn(){
  if(_awT||!document.body)return;_awT=setTimeout(()=>_awT=null,8000);
  const d=document.createElement("div");
  d.style.cssText="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;max-width:92%;text-align:center";
  d.textContent="🔊 No voice played — raise your media volume, and use Chrome with Google Text-to-Speech installed.";
  document.body.appendChild(d);setTimeout(()=>{d.remove();},6000);
}
function speak(text,code){
  if(!window.speechSynthesis||!text){audioWarn();return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.85;
    if(!VOICES.length)loadVoices();
    const v=VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith(String(code).slice(0,2).toLowerCase()));
    if(v){u.voice=v;u.lang=v.lang;}else{u.lang=code;}
    /* Android Chrome drops speak() called synchronously after cancel() — defer it */
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){audioWarn();}},80);
    /* silent-failure detection: zero installed voices means nothing can play */
    if(!VOICES.length)setTimeout(audioWarn,900);
  }catch(e){audioWarn();}
}
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLowerCase().replace(/[؟?.,!¡،؛:"'’\-()]/g,"").trim();}
function go(v,a){ if(v==="home")renderHome(); else if(v==="lang")renderLang(a); window.scrollTo(0,0); }
/* ============ CEFR levels & international comparison ============ */
const CEFR=[
 {l:"A1",t:"Starter",d:"Everyday phrases, introductions, numbers 1–10."},
 {l:"A2",t:"Elementary",d:"Simple sentences about yourself, family, routine."},
 {l:"B1",t:"Intermediate",d:"Independent: opinions, plans, travel, familiar topics."},
 {l:"B2",t:"Upper-Intermediate",d:"Fluent interaction, detailed views, pros & cons."},
 {l:"C1",t:"Advanced",d:"Demanding material, implicit meaning, precise expression."},
 {l:"C2",t:"Mastery",d:"Near-native precision in any situation."}];
const EXAM_MAP=[
 {cefr:"A1",ielts:"—",toefl:"—",other:"HSK 1–2 · JLPT N5 · DELF A1 · Goethe A1"},
 {cefr:"A2",ielts:"—",toefl:"—",other:"HSK 3 · JLPT N4 · DELF A2 · Goethe A2"},
 {cefr:"B1",ielts:"4.0–5.0",toefl:"42–71",other:"HSK 4 · JLPT N3 · DELF B1 · Goethe B1"},
 {cefr:"B2",ielts:"5.5–6.5",toefl:"72–94",other:"HSK 5 · JLPT N2 · DELF B2 · Goethe B2"},
 {cefr:"C1",ielts:"7.0–8.0",toefl:"95–120",other:"HSK 6 · JLPT N1 · DALF C1 · Goethe C1"},
 {cefr:"C2",ielts:"8.5–9.0",toefl:"110–120",other:"DALF C2 · Goethe C2 · HSK 7–9"}];
function levelsTab(id){
  const l=lang(id),v=VARIANTS[id],B=$("tabbody");
  const need={B1:"pro",B2:"pro",C1:"premium",C2:"expert"};
  let h=`<div class="scriptbox" style="margin-bottom:16px"><h3>🎓 ${l.name} — Starter to Mastery</h3>
  <p>International CEFR scale (A1→C2). Train each level, then pass the exam to earn your certificate.</p></div>`;
  h+=CEFR.map(c=>{
    const req=need[c.l];
    const lock=req&&!hasTier(req,id);
    const btn=c.l==="A1"?`<button class="btn btn-p" onclick="flashStart('${id}',lang('${id}').phrases,'reading')">Start A1 drills</button>`
      :c.l==="A2"?`<button class="btn btn-p" onclick="writeStart('${id}')">Start A2 drills</button>`
      :c.l==="B1"?`<button class="btn btn-p" onclick="revQuizStart('${id}')">Start B1 drills</button>`
      :c.l==="B2"?`<button class="btn btn-p" onclick="timedQuizStart('${id}')">Start B2 drills</button>`
      :`<button class="btn btn-p" onclick="masteryStart('${id}','${c.l}')">Start ${c.l} challenge</button>`;
    return `<div class="pcard" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div><div class="t">${c.l} · ${c.t} ${lock?"🔒":""}</div><div class="m">${c.d}</div></div>
    <div>${lock?`<button class="btn btn-g" onclick="needTier('${req}','${c.l} level drills')">Unlock ${TIERS[req].name}</button>`:btn}</div></div></div>`;
  }).join("");
  // final exam CTA
  h+=`<div class="pcard" style="margin-bottom:12px;text-align:center;border:2px solid var(--amber)"><div class="t">📝 Final Exam</div><div class="m">25 questions · 20 seconds each · 70% to pass<br>Earns a <b>CEFR ${{pro:"B2",premium:"C1",expert:"C2"}[myTier(id)]||"B2"} completion certificate</b> 🎓</div>
  <div style="margin-top:10px"><button class="btn btn-a" onclick="EX._lang='${id}';examLangPick('B')">Take the exam 🚀</button></div></div>`;
  // variant comparison
  h+=`<div class="scriptbox" style="margin:18px 0"><h3>${v.title}</h3><p>${v.note}</p>`;
  if(v.pairs&&v.pairs.length)h+=`<div class="cards">`+v.pairs.map(p=>`<div class="pcard"><div class="t" style="font-size:17px">${esc(p[0])} <span style="color:var(--muted)">vs</span> ${esc(p[1])}</div><div class="m">${esc(p[2])}</div></div>`).join("")+`</div>`;
  h+=`</div>`;
  // international comparison table
  h+=`<div class="scriptbox"><h3>🌍 International exam comparison</h3><p>Where your Zubaan CEFR level sits against the world's standard tests.</p>
  <div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">
  <tr style="background:#eef7f2"><th style="padding:8px;text-align:left">CEFR</th><th style="padding:8px;text-align:left">IELTS</th><th style="padding:8px;text-align:left">TOEFL iBT</th><th style="padding:8px;text-align:left">Other exams</th></tr>
  ${EXAM_MAP.map(r=>`<tr style="border-top:1px solid #eee"><td style="padding:8px"><b>${r.cefr}</b></td><td style="padding:8px">${r.ielts}</td><td style="padding:8px">${r.toefl}</td><td style="padding:8px">${r.other}</td></tr>`).join("")}
  </table></div>
  <div class="note" style="margin-top:12px">Zubaan levels follow the CEFR scale used by IELTS, TOEFL, DELF, HSK, JLPT and Goethe exams. Our certificates are course-completion awards based on in-app exams — official accredited qualifications come from the exam bodies themselves.</div></div>`;
  B.innerHTML=h;
}
/* B1: reverse quiz — English → target, 6 options */
let RQ={};
function revQuizStart(id){
  if(!hasTier("pro",id)){needTier("pro","B1 drills");return;}
  const l=lang(id);RQ={l,i:0,score:0,qs:shuffle([...l.phrases,...l.vocab]).slice(0,10)};revQuizShow();
}
function revQuizShow(){
  const l=RQ.l,it=RQ.qs[RQ.i],B=$("tabbody");
  const pool=[...l.phrases,...l.numbers,...l.vocab].filter(x=>x.en!==it.en);
  const opts=shuffle([it,...shuffle(pool).slice(0,5)]);
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${RQ.i*10}%"></i></div>
  <div class="score">${RQ.i+1}/10 · B1 drill — score ${RQ.score}</div>
  <div class="qbox"><div class="prow">How do you say this in ${l.name}?</div>
  <div class="prompt" style="font-size:24px">${esc(it.en)}</div><div class="prow">${esc(it.ur)}</div>
  <div class="opts">${opts.map(o=>`<div class="opt" dir="auto" onclick="revAns(this,'${esc(o.t).replace(/'/g,"\\'")}','${esc(it.t).replace(/'/g,"\\'")}')">${esc(o.t)}</div>`).join("")}</div></div></div>`;
}
function revAns(el,pick,correct){
  document.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents="none");
  if(pick===correct){el.classList.add("right");RQ.score++;addXP(RQ.l.id,12);}
  else{el.classList.add("wrong");[...document.querySelectorAll(".opt")].find(o=>o.textContent===correct).classList.add("right");}
  setTimeout(()=>{RQ.i++;if(RQ.i>=10)doneScreen(RQ.l,"B1 Drill",RQ.score,10);else revQuizShow();},1000);
}
/* B2: timed quiz — 10 seconds per question */
let TQ={timer:null};
function timedQuizStart(id){
  if(!hasTier("pro",id)){needTier("pro","B2 drills");return;}
  const l=lang(id);TQ={l,i:0,score:0,qs:shuffle([...l.phrases,...l.numbers,...l.vocab]).slice(0,10)};timedShow();
}
function timedShow(){
  const l=TQ.l,it=TQ.qs[TQ.i],B=$("tabbody"),flip=Math.random()<0.5;
  const q=flip?{p:it.t,ans:it.en,pool:"en"}:{p:it.en,ans:it.t,pool:"t"};
  const all=[...l.phrases,...l.numbers,...l.vocab].filter(x=>x.en!==it.en);
  const opts=shuffle([it,...shuffle(all).slice(0,3)]);
  B.innerHTML=`<div class="sess"><div class="prog"><i style="width:${TQ.i*10}%"></i></div>
  <div class="score">${TQ.i+1}/10 · ⏱️ B2 timed — <b id="tleft" style="color:#b45309">10</b>s · score ${TQ.score}</div>
  <div class="qbox"><div class="prompt" dir="auto" style="font-size:26px">${esc(q.p)}</div>
  <div class="opts">${opts.map(o=>{const v=q.pool==="en"?o.en:o.t;return `<div class="opt" dir="auto" onclick="timedAns(this,'${esc(v).replace(/'/g,"\\'")}','${esc(q.ans).replace(/'/g,"\\'")}')">${esc(v)}</div>`;}).join("")}</div></div></div>`;
  let s=10;clearInterval(TQ.timer);
  TQ.timer=setInterval(()=>{s--;const e=$("tleft");if(e)e.textContent=s;if(s<=0){clearInterval(TQ.timer);timedAns(null,"",q.ans);}},1000);
}
function timedAns(el,pick,correct){
  clearInterval(TQ.timer);
  document.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents="none");
  if(el&&pick===correct){el.classList.add("right");TQ.score++;addXP(TQ.l.id,15);}
  else{if(el)el.classList.add("wrong");const r=[...document.querySelectorAll(".opt")].find(o=>o.textContent===correct);if(r)r.classList.add("right");}
  setTimeout(()=>{TQ.i++;if(TQ.i>=10)doneScreen(TQ.l,"⏱️ B2 Timed Drill",TQ.score,10);else timedShow();},900);
}
/* C1/C2: mastery challenge — 20 mixed questions, expert only */
let MC={};
function masteryStart(id,clvl){
  if(!hasTier("expert",id)){needTier("expert",clvl+" challenge");return;}
  const l=lang(id),pool=shuffle([...l.phrases,...l.numbers,...l.vocab]);
  MC={l,clvl,i:0,score:0,qs:pool.slice(0,20)};masteryShow();
}
function masteryShow(){
  const l=MC.l,it=MC.qs[MC.i],B=$("tabbody"),mode=MC.i%3;
  let inner="";

function legacyTier(){

function checkDigit(body){const A="0123456789ABCDEFGHJKMNPQRSTUVWXYZ";return A[[...body+"zubaan"].reduce((a,c)=>a+c.charCodeAt(0),0)%A.length];}
function validCode(code){
  const c=String(code||"").trim().toUpperCase();
  let m=c.match(/^ZUBAN-(BASIC|PRO|PREMIUM|EXPERT)-([A-Z]{2})-([A-Z0-9]{6})-([A-Z0-9])$/);
  if(m){
    const tier=m[1].toLowerCase(),lng=m[2].toLowerCase();
    if(!LANGS.some(l=>l.id===lng))return null;
    return checkDigit(m[1][0]+m[2]+m[3])===m[4]?{tier:tier,lang:lng}:null;
  }
  m=c.match(/^ZUBAN-(BASIC|PRO|PREMIUM|EXPERT)-([A-Z0-9]{6})-([A-Z0-9])$/);
  if(m){
    const tier=m[1].toLowerCase();
    return checkDigit(m[1][0]+m[2])===m[3]?{tier:tier,months:1,legacy:true}:null;

function planDayTasks(langId,day,total){
  const l=lang(langId),tasks=[];
  const p1=Math.ceil(total*0.34),p2=Math.ceil(total*0.67);
  const ph=day<=p1?0:day<=p2?1:2;
  const items=l?[...l.phrases,...l.vocab]:[];
  if(ph===0){
    const chunk=Math.max(1,Math.ceil(items.length/p1)),s=(day-1)*chunk;
    tasks.push("📖 Learn & read aloud: items "+(s+1)+"–"+Math.min(s+chunk,items.length));
    tasks.push("🔊 Listening practice — 1 round");
    tasks.push(day%3===0?"🔤 Review the script guide":"📝 Quick quiz — 1 round");
  }else if(ph===1){
    tasks.push("✍️ Writing practice — 1 round");
    tasks.push("🎙️ Speaking practice — 1 round");
    tasks.push(day%2?"📝 Quick quiz — 1 round":"🔊 Listening practice — 1 round");
  }else{
    const lv=["A1","A2","B1","B2"];
    tasks.push("🎓 "+lv[day%4]+" level drills — 1 round");
    tasks.push("⏱️ Timed quiz — 1 round");
    tasks.push(day===total?"📝 Take the FINAL EXAM":"🔁 Review your weakest skill");
  }
  return tasks;
}

    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${t.name} package</b><button class="btn btn-g" onclick="go('home')">Change</button></div>

  window.open("https://wa.me/923455550810?text="+encodeURIComponent(msg),"_blank");
